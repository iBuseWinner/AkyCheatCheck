language:
  prefix: '&8[&cAkyCheck&8] &r'

check:
  default-duration-seconds: 300
  max-duration-seconds: 1800
  auto-ban-on-timeout: true
  ban-command: 'ban %player% %reason%'
  confession-phrases:
    - 'я читер'
    - 'я признаюсь'
    - 'признаюсь в читах'
    - 'i am cheating'
  allowed-commands:
    - '/msg'
    - '/r'
    - '/tell'
  blocked-command-message: '&cВо время проверки можно писать только проверяющему. Команды заблокированы.'
  bossbar-title: '&cПроверка на читы &8| &f%time%'
  release-broadcast: '&a%player% прошёл проверку у %moderator%.'
  ban-broadcast: '&c%player% забанен по итогам проверки. Причина: %reason%'
  trophy:
    enabled: true
    material: DIAMOND
    name: '&bТрофей честного игрока'
    lore:
      - '&7Игрок &f%player% &7прошёл проверку.'
      - '&7Модератор: &f%moderator%'
      - '&7Дата: &f%date%'

cabins:
  - id: 'default'
    world: 'world'
    x: 0.5
    y: 100.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0

afk:
  enabled: true
  idle-seconds-before-check: 600
  scan-period-seconds: 30

compatibility:
  enable-flight-while-frozen: true
  disable-paper-fly-kick: true
  commands-on-check-start:
    - 'grim exempt %player%'
    - 'vulcan bypass add %player%'
  commands-on-check-end:
    - 'grim unexempt %player%'
    - 'vulcan bypass remove %player%'

ban-animation:
  enabled: true
  lightning: true
  explosion-particles: true
  sound: ENTITY_WITHER_SPAWN

audit:
  file:
    enabled: true
  discord:
    enabled: false
    webhook-url: ''
  telegram:
    enabled: false
    bot-token: ''
    chat-id: ''

web-dashboard:
  enabled: true
  host: '0.0.0.0'
  port: 8094
  token: 'change-me'
